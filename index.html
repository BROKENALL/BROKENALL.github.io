<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Christmas Tree</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0a0800, #1a1500, #0a0a00);
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        .title {
            position: absolute;
            top: 40px;
            text-align: center;
            font-size: 4rem;
            background: linear-gradient(45deg, #ffcc00, #ff9900, #ff6600);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 25px rgba(255, 204, 0, 0.8);
            z-index: 10;
            letter-spacing: 3px;
            font-weight: 900;
            font-family: 'Georgia', serif;
            text-transform: uppercase;
        }
        
        #scene-container {
            width: 100%;
            height: 100vh;
        }
        
        .bg-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .bg-particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255, 204, 0, 0.3);
            border-radius: 50%;
            animation: float 25s infinite linear;
        }
        
        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.5;
            }
            90% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(-100px) translateX(100px) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="title">Merry Christmas</div>
    <div id="scene-container"></div>
    
    <!-- 背景粒子效果 -->
    <div class="bg-particles" id="bg-particles-container"></div>

    <script>
        // 创建背景粒子
        function createBackgroundParticles() {
            const container = document.getElementById('bg-particles-container');
            const particleCount = 20;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('bg-particle');
                
                // 随机位置
                particle.style.left = `${Math.random() * 100}vw`;
                particle.style.top = `${Math.random() * 100}vh`;
                
                // 随机大小
                const size = Math.random() * 4 + 2;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                // 金黄色调
                const colors = [
                    'rgba(255, 204, 0, 0.3)',
                    'rgba(255, 170, 0, 0.3)',
                    'rgba(255, 136, 0, 0.3)'
                ];
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                // 随机动画延迟和持续时间
                particle.style.animationDelay = `${Math.random() * 20}s`;
                particle.style.animationDuration = `${Math.random() * 30 + 20}s`;
                
                container.appendChild(particle);
            }
        }
        
        // 初始化变量
        let scene, camera, renderer;
        let treeGroup, sphereGroup;
        let isTreeMode = true;
        let transitionProgress = 0;
        let isTransitioning = false;
        
        // 创建圆形几何体
        function createCircleGeometry(radius, segments) {
            return new THREE.CircleGeometry(radius, segments);
        }
        
        // 创建菱形几何体
        function createDiamondGeometry(size) {
            const shape = new THREE.Shape();
            shape.moveTo(0, -size);
            shape.lineTo(size, 0);
            shape.lineTo(0, size);
            shape.lineTo(-size, 0);
            shape.lineTo(0, -size);
            
            return new THREE.ShapeGeometry(shape);
        }
        
        // 创建五角星几何体
        function createStarGeometry(size) {
            const shape = new THREE.Shape();
            const spikes = 5;
            const outerRadius = size;
            const innerRadius = size * 0.4;
            
            for (let i = 0; i < spikes * 2; i++) {
                const radius = i % 2 === 0 ? outerRadius : innerRadius;
                const angle = (i * Math.PI) / spikes;
                
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;
                
                if (i === 0) {
                    shape.moveTo(x, y);
                } else {
                    shape.lineTo(x, y);
                }
            }
            
            shape.closePath();
            return new THREE.ShapeGeometry(shape);
        }
        
        // 获取金黄色调颜色
        function getGoldenColor(height, maxHeight, shapeType) {
            // 金黄色调，从深金色到浅金色
            let hue = 0.12 + (height / maxHeight) * 0.08;
            let saturation = 0.8 + Math.random() * 0.2;
            let lightness = 0.3 + (height / maxHeight) * 0.5;
            
            // 根据形状类型微调
            if (shapeType === 0) { // 圆形 - 偏亮金色
                lightness += 0.1;
            } else if (shapeType === 1) { // 菱形 - 偏橙金色
                hue += 0.02;
            } else { // 五角星 - 偏红金色
                hue += 0.04;
            }
            
            const color = new THREE.Color();
            color.setHSL(hue, saturation, lightness);
            
            return color;
        }
        
        // 获取球体金黄色调颜色
        function getSphereGoldenColor(particleIndex, totalParticles) {
            const hue = 0.1 + (particleIndex / totalParticles) * 0.15;
            const saturation = 0.8 + Math.random() * 0.2;
            const lightness = 0.4 + Math.random() * 0.4;
            
            const color = new THREE.Color();
            color.setHSL(hue, saturation, lightness);
            
            return color;
        }
        
        // 初始化场景
        function init() {
            // 创建场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0800);
            
            // 创建相机
            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 35;
            camera.position.y = 10;
            
            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ 
                antialias: true,
                alpha: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('scene-container').appendChild(renderer.domElement);
            
            // 添加环境光
            const ambientLight = new THREE.AmbientLight(0xffcc00, 0.4);
            scene.add(ambientLight);
            
            // 添加金色点光源
            const pointLight = new THREE.PointLight(0xffcc00, 1.8, 250);
            pointLight.position.set(30, 40, 30);
            scene.add(pointLight);
            
            // 创建树组和球体组
            treeGroup = new THREE.Group();
            sphereGroup = new THREE.Group();
            scene.add(treeGroup);
            scene.add(sphereGroup);
            
            // 创建金色几何形状粒子圣诞树
            createGoldenTree();
            
            // 创建金色球体粒子
            createGoldenSphere();
            
            // 初始隐藏球体
            sphereGroup.visible = false;
            
            // 添加轨道控制器
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 1.8;
            
            // 窗口大小调整事件
            window.addEventListener('resize', onWindowResize);
            
            // 点击切换事件
            document.addEventListener('click', toggleMode);
            
            // 开始动画
            animate();
            
            // 创建背景粒子
            createBackgroundParticles();
        }
        
        // 创建金色几何形状粒子圣诞树
        function createGoldenTree() {
            const totalParticles = 3500;
            
            // 树的参数
            const treeHeight = 24;
            const baseRadius = 12;
            const treeBottomY = -10;
            
            // 创建所有粒子
            for (let i = 0; i < totalParticles; i++) {
                // 树的高度
                const height = Math.random() * treeHeight;
                
                // 使用更陡的锥形函数确保树顶是尖的
                const heightRatio = 1 - (height / treeHeight);
                const radius = baseRadius * Math.pow(heightRatio, 2.2) * 0.6;
                const angle = Math.random() * Math.PI * 2;
                
                // 计算粒子位置
                const widthVariation = Math.random() * 0.7 + 0.7;
                const x = Math.cos(angle) * radius * widthVariation;
                const y = height + treeBottomY;
                const z = Math.sin(angle) * radius * widthVariation;
                
                // 随机选择几何形状
                const shapeType = Math.floor(Math.random() * 3);
                let geometry;
                let size;
                
                // 超迷你尺寸
                if (shapeType === 0) { // 圆形
                    size = Math.random() * 0.08 + 0.025;
                    geometry = createCircleGeometry(size, 5);
                } else if (shapeType === 1) { // 菱形
                    size = Math.random() * 0.06 + 0.02;
                    geometry = createDiamondGeometry(size);
                } else { // 五角星
                    size = Math.random() * 0.05 + 0.015;
                    geometry = createStarGeometry(size);
                }
                
                // 获取金黄色
                const color = getGoldenColor(height, treeHeight, shapeType);
                
                // 创建材质
                const material = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.95,
                    side: THREE.DoubleSide
                });
                
                // 创建网格
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(x, y, z);
                
                // 随机旋转
                mesh.rotation.x = Math.random() * Math.PI;
                mesh.rotation.y = Math.random() * Math.PI;
                mesh.rotation.z = Math.random() * Math.PI;
                
                // 存储粒子数据
                mesh.userData = {
                    originalPosition: new THREE.Vector3(x, y, z),
                    treePosition: new THREE.Vector3(x, y, z),
                    originalColor: color.clone(),
                    rotationSpeed: new THREE.Vector3(
                        Math.random() * 0.004 - 0.002,
                        Math.random() * 0.004 - 0.002,
                        Math.random() * 0.004 - 0.002
                    ),
                    floatSpeed: Math.random() * 0.006 + 0.003,
                    floatOffset: Math.random() * Math.PI * 2,
                    shapeType: shapeType,
                    pulseSpeed: Math.random() * 0.002 + 0.001,
                    pulseOffset: Math.random() * Math.PI * 2
                };
                
                treeGroup.add(mesh);
            }
        }
        
        // 创建金色球体粒子
        function createGoldenSphere() {
            const totalParticles = 3500;
            const sphereRadius = 13;
            
            // 创建所有粒子
            for (let i = 0; i < totalParticles; i++) {
                // 球体上的随机位置（均匀分布）
                const u = Math.random();
                const v = Math.random();
                const theta = 2 * Math.PI * u;
                const phi = Math.acos(2 * v - 1);
                
                const x = sphereRadius * Math.sin(phi) * Math.cos(theta);
                const y = sphereRadius * Math.cos(phi);
                const z = sphereRadius * Math.sin(phi) * Math.sin(theta);
                
                // 随机选择几何形状
                const shapeType = Math.floor(Math.random() * 3);
                let geometry;
                let size;
                
                // 超迷你尺寸
                if (shapeType === 0) { // 圆形
                    size = Math.random() * 0.08 + 0.025;
                    geometry = createCircleGeometry(size, 5);
                } else if (shapeType === 1) { // 菱形
                    size = Math.random() * 0.06 + 0.02;
                    geometry = createDiamondGeometry(size);
                } else { // 五角星
                    size = Math.random() * 0.05 + 0.015;
                    geometry = createStarGeometry(size);
                }
                
                // 获取金黄色
                const color = getSphereGoldenColor(i, totalParticles);
                
                // 创建材质
                const material = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.95,
                    side: THREE.DoubleSide
                });
                
                // 创建网格
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(x, y, z);
                
                // 面向球心
                const direction = new THREE.Vector3().subVectors(new THREE.Vector3(0, 0, 0), mesh.position).normalize();
                mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), direction);
                
                // 随机旋转
                mesh.rotation.z = Math.random() * Math.PI * 2;
                
                // 存储粒子数据
                mesh.userData = {
                    originalPosition: new THREE.Vector3(x, y, z),
                    spherePosition: new THREE.Vector3(x, y, z),
                    originalColor: color.clone(),
                    rotationSpeed: new THREE.Vector3(
                        Math.random() * 0.006 - 0.003,
                        Math.random() * 0.006 - 0.003,
                        Math.random() * 0.006 - 0.003
                    ),
                    shapeType: shapeType,
                    pulseSpeed: Math.random() * 0.002 + 0.001,
                    pulseOffset: Math.random() * Math.PI * 2
                };
                
                sphereGroup.add(mesh);
            }
        }
        
        // 切换模式
        function toggleMode() {
            if (isTransitioning) return;
            
            isTransitioning = true;
            transitionProgress = 0;
            
            // 准备过渡数据
            const totalParticles = Math.min(treeGroup.children.length, sphereGroup.children.length);
            
            if (isTreeMode) {
                // 树 -> 球体：为树粒子设置目标位置和颜色
                for (let i = 0; i < totalParticles; i++) {
                    const treeMesh = treeGroup.children[i];
                    const sphereMesh = sphereGroup.children[i];
                    
                    if (treeMesh && sphereMesh) {
                        treeMesh.userData.targetPosition = sphereMesh.userData.spherePosition;
                        treeMesh.userData.targetColor = sphereMesh.userData.originalColor;
                    }
                }
            } else {
                // 球体 -> 树：为球体粒子设置目标位置和颜色
                for (let i = 0; i < totalParticles; i++) {
                    const sphereMesh = sphereGroup.children[i];
                    const treeMesh = treeGroup.children[i];
                    
                    if (sphereMesh && treeMesh) {
                        sphereMesh.userData.targetPosition = treeMesh.userData.treePosition;
                        sphereMesh.userData.targetColor = treeMesh.userData.originalColor;
                    }
                }
            }
        }
        
        // 更新切换动画
        function updateTransition() {
            if (!isTransitioning) return;
            
            transitionProgress += 0.02;
            
            if (transitionProgress >= 1) {
                // 过渡完成
                transitionProgress = 1;
                isTransitioning = false;
                
                // 切换模式
                isTreeMode = !isTreeMode;
                
                // 切换可见性
                if (isTreeMode) {
                    treeGroup.visible = true;
                    sphereGroup.visible = false;
                    
                    // 重置树粒子到原始位置和颜色
                    treeGroup.children.forEach(mesh => {
                        mesh.position.copy(mesh.userData.treePosition);
                        mesh.material.color.copy(mesh.userData.originalColor);
                    });
                } else {
                    treeGroup.visible = false;
                    sphereGroup.visible = true;
                    
                    // 重置球体粒子到原始位置和颜色
                    sphereGroup.children.forEach(mesh => {
                        mesh.position.copy(mesh.userData.spherePosition);
                        mesh.material.color.copy(mesh.userData.originalColor);
                        // 重新面向球心
                        const direction = new THREE.Vector3().subVectors(new THREE.Vector3(0, 0, 0), mesh.position).normalize();
                        mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), direction);
                    });
                }
                
                return;
            }
            
            // 使用平滑缓动函数
            const easedProgress = smoothStep(transitionProgress);
            
            // 更新粒子位置和颜色
            if (isTreeMode) {
                // 树 -> 球体
                treeGroup.children.forEach(mesh => {
                    if (mesh.userData.targetPosition && mesh.userData.targetColor) {
                        // 位置插值
                        mesh.position.lerpVectors(
                            mesh.userData.treePosition,
                            mesh.userData.targetPosition,
                            easedProgress
                        );
                        
                        // 颜色插值
                        mesh.material.color.lerpColors(
                            mesh.userData.originalColor,
                            mesh.userData.targetColor,
                            easedProgress
                        );
                    }
                });
            } else {
                // 球体 -> 树
                sphereGroup.children.forEach(mesh => {
                    if (mesh.userData.targetPosition && mesh.userData.targetColor) {
                        // 位置插值
                        mesh.position.lerpVectors(
                            mesh.userData.spherePosition,
                            mesh.userData.targetPosition,
                            easedProgress
                        );
                        
                        // 颜色插值
                        mesh.material.color.lerpColors(
                            mesh.userData.originalColor,
                            mesh.userData.targetColor,
                            easedProgress
                        );
                    }
                });
            }
        }
        
        // 平滑缓动函数
        function smoothStep(t) {
            return t * t * (3 - 2 * t);
        }
        
        // 窗口大小调整处理
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            // 更新切换动画
            updateTransition();
            
            // 正常动画
            if (!isTransitioning) {
                if (isTreeMode && treeGroup.visible) {
                    // 圣诞树动画
                    treeGroup.rotation.y += 0.0002;
                    
                    // 更新树粒子动画
                    treeGroup.children.forEach(mesh => {
                        const data = mesh.userData;
                        
                        // 旋转
                        mesh.rotation.x += data.rotationSpeed.x;
                        mesh.rotation.y += data.rotationSpeed.y;
                        mesh.rotation.z += data.rotationSpeed.z;
                        
                        // 上下浮动
                        const floatAmount = Math.sin(Date.now() * 0.001 * data.floatSpeed + 
                                                   data.floatOffset) * 0.1;
                        mesh.position.y = data.treePosition.y + floatAmount;
                        
                        // 轻微脉动效果
                        const pulse = 0.96 + Math.sin(Date.now() * 0.001 * data.pulseSpeed + 
                                                    data.pulseOffset) * 0.08;
                        mesh.scale.setScalar(pulse);
                        
                        // 根据形状类型添加特殊效果
                        if (data.shapeType === 0) { // 圆形
                            const scaleX = 0.94 + Math.sin(Date.now() * 0.001 + mesh.position.x) * 0.12;
                            const scaleY = 0.94 + Math.cos(Date.now() * 0.001 + mesh.position.y) * 0.12;
                            mesh.scale.set(scaleX, scaleY, 1);
                        } else if (data.shapeType === 1) { // 菱形
                            mesh.rotation.z += 0.006;
                        } else { // 五角星
                            const opacity = 0.85 + Math.sin(Date.now() * 0.002 + mesh.position.z) * 0.15;
                            mesh.material.opacity = Math.max(0.7, Math.min(1, opacity));
                        }
                    });
                } else if (!isTreeMode && sphereGroup.visible) {
                    // 球体动画
                    sphereGroup.rotation.y += 0.0006;
                    sphereGroup.rotation.x += 0.0003;
                    
                    // 更新球体粒子动画
                    sphereGroup.children.forEach(mesh => {
                        const data = mesh.userData;
                        
                        // 旋转
                        mesh.rotation.x += data.rotationSpeed.x;
                        mesh.rotation.y += data.rotationSpeed.y;
                        mesh.rotation.z += data.rotationSpeed.z;
                        
                        // 轻微脉动
                        const pulse = 0.95 + Math.sin(Date.now() * 0.001 * data.pulseSpeed + 
                                                    data.pulseOffset) * 0.1;
                        mesh.scale.setScalar(pulse);
                    });
                }
            }
            
            renderer.render(scene, camera);
        }
        
        // 页面加载完成后初始化
        window.addEventListener('load', init);
    </script>
</body>
</html>
